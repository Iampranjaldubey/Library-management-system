# One-command local stack: MySQL + Spring Boot backend.
#
# NOTE: the credentials below are throwaway LOCAL-DEV values only.
# Never reuse them in staging/production — inject real secrets via the
# environment there. This file exists so a reviewer can run:
#
#     docker compose up --build
#
# and get a working API at http://localhost:8080/swagger-ui.html
services:
  db:
    image: mysql:8.0
    container_name: libraryos-db
    environment:
      MYSQL_DATABASE: library_db
      MYSQL_USER: library_user
      MYSQL_PASSWORD: library_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: libraryos-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://db:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      DB_USERNAME: library_user
      DB_PASSWORD: library_pass
      JWT_SECRET: "dGhpc2lzYXZlcnlzdHJvbmdzZWNyZXRrZXlmb3JsaWJyYXJ5bWFuYWdlbWVudHN5c3RlbTIwMjQ="
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  db_data:
