# ── Server ──────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
# Trust the X-Forwarded-Proto / X-Forwarded-For headers injected by Railway's
# reverse proxy so that Spring (and springdoc) see "https" as the scheme instead
# of the internal "http" used between the proxy and the app container.
server.forward-headers-strategy=framework

# ── DataSource (MySQL) ──────────────────────────────────────────────────────────

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────────
# Use 'validate' so Hibernate checks schema on startup but never modifies it.
# Schema changes are managed by Flyway migrations (see db/migration/).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Keep the Hibernate session open for the full HTTP request so lazy relations
# can be accessed during response serialisation (Open Session in View pattern).
spring.jpa.open-in-view=true

# ── Flyway Database Migrations ────────────────────────────────────────────────────
spring.flyway.enabled=true
# baseline-on-migrate allows Flyway to adopt a database that was previously
# managed by Hibernate ddl-auto without failing on existing tables.
spring.application.name=library-management

# Google OAuth2 Setup
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
# Access token expiry: 15 minutes (900000 ms)
app.jwt.expiration-ms=900000
# Refresh token expiry: 7 days (604800000 ms)
app.jwt.refresh-expiration-ms=604800000

# ── Jackson ───────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false

# ── SpringDoc / Swagger ───────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ── Email (SMTP) ──────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Application Settings ─────────────────────────────────────────────────────
app.mail.from=${MAIL_FROM:noreply@libraryos.com}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ── Auth refresh-token cookie ─────────────────────────────────────────────────
# The refresh token is delivered ONLY via an HttpOnly cookie (never the JSON body),
# so it is not readable by JavaScript/XSS. Production default assumes a cross-site
# setup (Vercel frontend -> Railway API): SameSite=None + Secure=true.
# For same-origin local dev over http, override to Lax/false (see docker-compose.yml).
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAMESITE:None}
app.auth.refresh-cookie.path=/api/v1/auth

